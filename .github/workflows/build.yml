name: Build

# Daily release of the installer: publishes what is new on the private source main, if anything.
on:
  schedule:
    # 04:20 in Brasília (UTC-3).
    - cron: '20 7 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing source tag to republish, e.g. v2.33.3 (empty releases what is new)'
        required: false
        default: ''
      publish:
        description: 'Publish the release (off only builds)'
        type: boolean
        default: true

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: mri-Qbox-Brasil/workflows/.github/workflows/callable-installer-build.yml@main
    with:
      tag: ${{ inputs.tag || '' }}
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}

  # GitHub turns schedules off after 60 days without commits; re-enabling resets that.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
